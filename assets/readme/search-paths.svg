<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="288" viewBox="0 0 1200 288"
     role="img" aria-labelledby="title desc">
  <title id="title">两条联网路径</title>
  <desc id="desc">原生 Search Tool 走网关 Responses；grok-search skill 走本地 Node 脚本。可并存，职责不同。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="288" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="286" rx="23" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <text x="56" y="46"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#38BDF8" letter-spacing="1.4">SEARCH PATHS</text>
  <text x="56" y="80"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
        font-size="24" font-weight="650" fill="#F8FAFC">两条联网路径 · 可并存、勿混用</text>

  <g transform="translate(56 120)">
    <rect x="0" y="20" width="160" height="72" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="80" y="50" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="16" font-weight="600" fill="#E2E8F0">会话</text>
    <text x="80" y="74" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#64748B">grok session</text>
  </g>

  <path d="M216 156 H280" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M280 156 V104 H320" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M280 156 V208 H320" stroke="#475569" stroke-width="2" fill="none"/>

  <g transform="translate(320 66)">
    <rect x="0" y="0" width="360" height="76" rx="12" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="20" y="32"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="17" font-weight="600" fill="#E0F2FE">原生 Search Tool</text>
    <text x="20" y="56"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#7DD3FC">web_search / x_search · Responses</text>
  </g>

  <g transform="translate(720 66)">
    <rect x="0" y="0" width="424" height="76" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#64748B">config</text>
    <text x="20" y="56"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#CBD5E1">~/.grok/config.toml</text>
  </g>

  <g transform="translate(320 170)">
    <rect x="0" y="0" width="360" height="76" rx="12" fill="#3A2A0A" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="20" y="32"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="17" font-weight="600" fill="#FEF3C7">grok-search skill</text>
    <text x="20" y="56"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#FCD34D">search / fetch / map · Node</text>
  </g>

  <g transform="translate(720 170)">
    <rect x="0" y="0" width="424" height="76" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#64748B">config</text>
    <text x="20" y="56"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#CBD5E1">~/.config/grok-search/config.json</text>
  </g>
</svg>
