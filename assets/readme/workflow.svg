<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="268" viewBox="0 0 1200 268"
     role="img" aria-labelledby="title desc">
  <title id="title">GrokBuild 安装流水线</title>
  <desc id="desc">四步：安装 CLI、下载模板、交互写入配置、可选 grok-search skill。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="268" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="266" rx="23" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <text x="56" y="48"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#38BDF8" letter-spacing="1.4">PIPELINE</text>
  <text x="56" y="82"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
        font-size="26" font-weight="650" fill="#F8FAFC">一条命令完成安装与配置</text>

  <line x1="140" y1="168" x2="1060" y2="168" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="168" x2="1060" y2="168" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 12" opacity="0.4"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g transform="translate(80 118)">
      <circle cx="48" cy="50" r="26" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
      <text x="48" y="56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" font-weight="700" fill="#7DD3FC">1</text>
      <text x="48" y="104" text-anchor="middle" font-size="17" font-weight="600" fill="#E2E8F0">装 CLI</text>
      <text x="48" y="126" text-anchor="middle" font-size="13" fill="#64748B">x.ai install</text>
    </g>

    <g transform="translate(340 118)">
      <circle cx="48" cy="50" r="26" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
      <text x="48" y="56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" font-weight="700" fill="#7DD3FC">2</text>
      <text x="48" y="104" text-anchor="middle" font-size="17" font-weight="600" fill="#E2E8F0">拉模板</text>
      <text x="48" y="126" text-anchor="middle" font-size="13" fill="#64748B">config + wizard</text>
    </g>

    <g transform="translate(600 118)">
      <circle cx="48" cy="50" r="26" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
      <text x="48" y="56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" font-weight="700" fill="#7DD3FC">3</text>
      <text x="48" y="104" text-anchor="middle" font-size="17" font-weight="600" fill="#E2E8F0">写配置</text>
      <text x="48" y="126" text-anchor="middle" font-size="13" fill="#64748B">~/.grok/config.toml</text>
    </g>

    <g transform="translate(860 118)">
      <circle cx="48" cy="50" r="26" fill="#3A2A0A" stroke="#FBBF24" stroke-width="2"/>
      <text x="48" y="56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" font-weight="700" fill="#FBBF24">4</text>
      <text x="48" y="104" text-anchor="middle" font-size="17" font-weight="600" fill="#E2E8F0">可选 skill</text>
      <text x="48" y="126" text-anchor="middle" font-size="13" fill="#64748B">grok-search</text>
    </g>
  </g>
</svg>
