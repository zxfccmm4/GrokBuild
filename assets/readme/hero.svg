<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">GrokBuild</title>
  <desc id="desc">Bring your own OpenAI-compatible gateway to Grok Build CLI. Default model grok-4.7.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0B0E"/>
      <stop offset="0.55" stop-color="#111318"/>
      <stop offset="1" stop-color="#171A20"/>
    </linearGradient>
    <linearGradient id="acid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7FF3F"/>
      <stop offset="1" stop-color="#8DFF68"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#2A2E36" stroke-width="2"/>

  <g transform="translate(54 46)">
    <rect width="145" height="30" rx="15" fill="#D7FF3F"/>
    <text x="72.5" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800" letter-spacing="1.8" fill="#0A0B0E">GATEWAY KIT</text>

    <text x="0" y="112" font-family="Arial Black, Arial, PingFang SC, sans-serif" font-size="68" font-weight="900" letter-spacing="-3" fill="#F5F7FA">GrokBuild</text>
    <rect x="0" y="132" width="455" height="5" rx="2.5" fill="url(#acid)"/>

    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23" font-weight="650" fill="#E8E9ED">让 Grok Build 使用你的 OpenAI 兼容网关</text>
    <text x="0" y="221" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16" fill="#8B919C">INSTALL CLI  /  WRITE CONFIG  /  ENABLE SEARCH</text>

    <g transform="translate(0 268)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect width="170" height="42" rx="10" fill="#191C22" stroke="#353A44"/>
      <text x="18" y="18" font-size="10" letter-spacing="1.4" fill="#737A86">DEFAULT MODEL</text>
      <text x="18" y="33" font-size="14" font-weight="700" fill="#D7FF3F">grok-4.7</text>

      <rect x="182" width="138" height="42" rx="10" fill="#191C22" stroke="#353A44"/>
      <text x="200" y="18" font-size="10" letter-spacing="1.4" fill="#737A86">PLATFORM</text>
      <text x="200" y="33" font-size="14" font-weight="700" fill="#F5F7FA">macOS · Linux</text>

      <rect x="332" width="154" height="42" rx="10" fill="#191C22" stroke="#353A44"/>
      <text x="350" y="18" font-size="10" letter-spacing="1.4" fill="#737A86">MODE</text>
      <text x="350" y="33" font-size="14" font-weight="700" fill="#55C2FF">BYO Gateway</text>
    </g>
  </g>

  <g transform="translate(654 44)">
    <rect width="492" height="332" rx="18" fill="#0D0F13" stroke="#323741" stroke-width="1.5"/>
    <rect width="492" height="44" rx="18" fill="#181B21"/>
    <rect y="25" width="492" height="19" fill="#181B21"/>
    <circle cx="24" cy="22" r="5" fill="#FF6B6B"/>
    <circle cx="44" cy="22" r="5" fill="#FFB84D"/>
    <circle cx="64" cy="22" r="5" fill="#D7FF3F"/>
    <text x="246" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#747B87">grokbuild / setup</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <text x="24" y="79" fill="#59606B">$</text>
      <text x="45" y="79" fill="#F5F7FA">./install-config.sh</text>

      <text x="24" y="118" fill="#D7FF3F">01</text>
      <text x="60" y="118" fill="#AEB4BE">model alias</text>
      <text x="398" y="118" text-anchor="end" fill="#F5F7FA">Steve</text>

      <text x="24" y="154" fill="#D7FF3F">02</text>
      <text x="60" y="154" fill="#AEB4BE">upstream model</text>
      <text x="398" y="154" text-anchor="end" fill="#FF8A3D">grok-4.7</text>

      <text x="24" y="190" fill="#D7FF3F">03</text>
      <text x="60" y="190" fill="#AEB4BE">base_url</text>
      <text x="398" y="190" text-anchor="end" fill="#55C2FF">https://…/v1</text>

      <text x="24" y="226" fill="#D7FF3F">04</text>
      <text x="60" y="226" fill="#AEB4BE">api_key</text>
      <text x="398" y="226" text-anchor="end" fill="#F5F7FA">••••••••••••</text>

      <rect x="22" y="256" width="448" height="52" rx="10" fill="#151A12" stroke="#D7FF3F" stroke-opacity="0.45"/>
      <circle cx="43" cy="282" r="5" fill="#D7FF3F" filter="url(#glow)"/>
      <text x="60" y="287" fill="#D7FF3F" font-weight="700">READY</text>
      <text x="130" y="287" fill="#8B919C">~/.grok/config.toml</text>
    </g>
  </g>
</svg>
