[cli]
installer = "internal"

[models]
default = "Steve"
default_reasoning_effort = "high"
# Optional: point Build's web_search tool at this custom model.
# Enable via install-config.sh ("开启 Search Tool") or uncomment:
# web_search = "Steve"

[model.Steve]
model = "grok-4.5"
base_url = "https://YOUR_API_BASE_URL/v1"
name = "grok-4.5"
api_key = "YOUR_API_KEY"
context_window = 500000
supports_reasoning_effort = true
reasoning_efforts = [
    "low",
    "medium",
    "high",
]
# Optional: native web_search / x_search via Responses API (e.g. grok2api Build channel).
# Enable via install-config.sh ("开启 Search Tool") or uncomment both:
# api_backend = "responses"
# supports_backend_search = true

[features]
telemetry = false
feedback = false

[telemetry]
trace_upload = false
mixpanel_enabled = false

[harness]
disable_codebase_upload = true

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-build"
yolo = false
compact_mode = false
permission_mode = "always-approve"
